name: Keep backend awake

on:
  schedule:
    # Every 13 minutes, only in November and December
    - cron: "*/13 * * 11,12 *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping only between Nov 10 and Dec 15
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          START="2026-11-10"
          END="2026-12-15"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run, pinging now."
          elif [[ "$TODAY" < "$START" || "$TODAY" > "$END" ]]; then
            echo "Today is $TODAY, outside $START to $END. Skipping."
            exit 0
          fi

          echo "Pinging Render..."
          curl -fsS --max-time 90 https://guild-backend-vqg5.onrender.com/health || echo "Ping failed or timed out, will retry next run."
name: Keep database active

on:
  schedule:
    - cron: "17 13 * * *"   # once a day, 13:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database (stops Supabase pausing)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$TODAY" > "2026-12-31" ]]; then
            echo "Past Dec 31, skipping."
            exit 0
          fi
          curl -fsS --max-time 120 https://guild-backend-vqg5.onrender.com/health/db
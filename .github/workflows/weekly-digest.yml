name: Weekly guild digest

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (8 AM New York)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the backend
        run: curl -sS --max-time 90 https://guild-backend-vqg5.onrender.com/ || true
      - name: Publish digests
        env:
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          curl -fsS -X POST https://guild-backend-vqg5.onrender.com/tasks/weekly-digest \
            -H "X-Task-Secret: $TASK_SECRET" --max-time 120

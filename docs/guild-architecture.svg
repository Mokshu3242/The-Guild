-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#000">Bryntum Scheduler: Who's free</text><text x="374" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#000">Client portal: agreement + approvals</text><text x="374" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#000">/try: one-click demo logins</text><text x="374" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#000">/trail: money trail per invoice</text><rect x="360" y="560" width="320" height="100" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="374" y="586" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#000">MCP server</text><text x="374" y="606" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#000" font-style="italic">mcp/guild_mcp.py · official MCP SDK</text><text x="374" y="630" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#000">Tools: quote, hire, job status</text><rect x="760" y="150" width="380" height="610" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="774" y="178" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#000">Guild API</text><text x="774" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#000" font-style="italic">FastAPI · SQLModel · Alembic · on Render</text><rect x="776" y="214" width="348" height="76" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><text x="788" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#000">Guards</text><text x="788" y="255" font-family="Helvetica, Arial, sans-seri